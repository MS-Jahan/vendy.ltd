<section class="page-head"><div class="wrap">
  <h1>Contact Us</h1>
  <p>Please do not hesitate to get in touch with us. Feel free to ask any question you may have.</p>
</div></section>

<section class="page-body">
  <div class="wrap contact-grid">
    <div class="blueprint contact-card"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <h2>Visit Us</h2>
      <dl>
        <div><dt>Vendy Ltd.</dt><dd>{{address}}</dd></div>
        <div><dt>E-Mail</dt><dd><a href="mailto:{{email}}">{{email}}</a></dd></div>
        <div><dt>Phone</dt><dd><a href="tel:{{phone_href}}">(+880) 1714-890252</a></dd></div>
        <div><dt>Website</dt><dd><a href="https://{{website}}/">www.{{website}}</a></dd></div>
      </dl>
      <div class="wa-qr">
        <a class="wa-qr-code" href="{{whatsapp_url}}" target="_blank" rel="noopener"><img src="/assets/img/whatsapp-qr.svg" alt="QR code to chat with Vendy Ltd on WhatsApp" width="132" height="132" loading="lazy"></a>
        <p><strong>For WhatsApp, scan this QR code.</strong> <span>Or <a href="{{whatsapp_url}}" target="_blank" rel="noopener">open the chat</a> on {{phone}}.</span></p>
      </div>
      <a class="btn btn-primary btn-block" href="{{form_url}}" target="_blank" rel="noopener" data-track="contact-form-click">E-Mail Us</a>
    </div>
    <div class="blueprint map-frame"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
      <iframe src="{{map_url}}" title="Vendy Ltd on Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>
  </div>
</section>
