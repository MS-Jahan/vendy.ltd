<section id="resources" class="resources resources-page" aria-labelledby="resources-title">
  <div class="wrap resources-grid">
    <h1 id="resources-title" class="block-title">Resources</h1>
    <ul class="link-rows">
      <li><a href="/tutorials/"><span>Tutorials</span></a></li>
      <li><a href="/faqs/"><span>FAQ’s</span></a></li>
      <li><a href="/vending_details/"><span>Vending Machine FAQ’s</span></a></li>

<section class="cta-band" aria-labelledby="cta-title">
  <div class="wrap">
    <h2 id="cta-title" class="cta-title">Contact Us</h2>
    <div class="cta-grid">
      <p>Please do not hesitate to get in touch with us. Feel free to ask any question you may have.</p>
      <div class="cta-links">
        <a href="tel:{{phone_href}}">{{phone}}</a>
        <a href="mailto:{{email}}">{{email}}</a>
        <div><a class="btn btn-light" href="{{form_url}}" target="_blank" rel="noopener" data-track="contact-form-click">Send a message</a></div>
      </div>
    </div>
  </div>
</section>
