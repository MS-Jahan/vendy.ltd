# Deploy the static site to cPanel over FTP/FTPS.
# Builds src/ -> dist/ with build.py, then uploads dist/ into FTP_SERVER_DIR
# using lftp (reconnect-tolerant, one connection, password via env, never on disk).
# Files on the server that are not in dist/ are left alone unless `delete` is set.
name: Deploy (FTP)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Show what would transfer; do not upload.
        type: boolean
        default: false
      delete:
        description: Also delete server files that are not in dist/ (mirror --delete). Use with care.
        type: boolean
        default: false
      verbose_log:
        description: Verbose lftp log.
        type: boolean
        default: false

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and upload dist/ via FTP
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify FTP secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="${missing} FTP_SERVER_or_FTP_HOST"
          [ -z "$FTP_USER" ] && missing="${missing} FTP_USER"
          [ -z "$FTP_PASS" ] && missing="${missing} FTP_PASS"
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty required secrets:$missing. Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Build site
        run: |
          python3 build.py
          test -f dist/index.html || { echo "::error::dist/index.html missing after build"; exit 1; }
          test -f dist/.htaccess || { echo "::error::dist/.htaccess missing after build"; exit 1; }

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload dist/ via FTP (lftp)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASS }}
          FTP_PORT: ${{ secrets.FTP_PORT || '21' }}
          FTP_PROTOCOL: ${{ secrets.FTP_PROTOCOL || 'ftp' }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR || './' }}
          DRY_RUN: ${{ inputs.dry_run }}
          DELETE: ${{ inputs.delete }}
          VERBOSE: ${{ inputs.verbose_log && '3' || '1' }}
        run: |
          case "$FTP_PROTOCOL" in
            ftp)         scheme=ftp;  ssl=no  ;;
            ftps)        scheme=ftp;  ssl=yes ;;   # explicit AUTH TLS (cPanel Pure-FTPd)
            ftps-legacy) scheme=ftps; ssl=yes ;;   # implicit FTPS
            *) echo "::error::Unknown FTP_PROTOCOL=$FTP_PROTOCOL"; exit 2 ;;
          esac

          opts="--reverse --ignore-time --parallel=1 --verbose=$VERBOSE"
          [ "$DELETE" = "true" ] && opts="$opts --delete"
          [ "$DRY_RUN" = "true" ] && opts="$opts --dry-run"

          cat > "$RUNNER_TEMP/deploy.lftp" <<LFTP
          set ssl:verify-certificate no
          set ftp:ssl-force $ssl
          set ftp:ssl-protect-data yes
          set ftp:passive-mode yes
          set net:max-retries 50
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set net:timeout 60
          set cmd:fail-exit yes
          open --env-password --user "$FTP_USER" -p "$FTP_PORT" "$scheme://$FTP_SERVER"
          mkdir -f -p "$FTP_SERVER_DIR"
          mirror $opts "dist" "$FTP_SERVER_DIR"
          bye
          LFTP

          echo "Deploying dist/ to $scheme://$FTP_SERVER/$FTP_SERVER_DIR (dry-run=$DRY_RUN delete=$DELETE)"
          lftp --norc -f "$RUNNER_TEMP/deploy.lftp"
